<!DOCTYPE html>
<html>
<head>
    <title>Longdo Events Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #map { 
            width: 100vw; 
            height: 100vh; 
        }
        .popup-content h3 { 
            margin-top: 0; 
            margin-bottom: 8px;
            color: #d32f2f;
            font-size: 16px;
        }
        .popup-content p {
            margin: 5px 0;
            font-size: 14px;
        }
        .popup-content small {
            color: #666;
        }
        .type-flood { color: #0288d1 !important; }
        .type-accident { color: #d32f2f !important; }
        .type-breakdown { color: #f57c00 !important; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Initialize the map, default center on Bangkok
        var map = L.map('map').setView([13.7563, 100.5018], 10);
        
        // Add Google Maps tiles (No API key required for this tile endpoint)
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 19,
            attribution: '&copy; Google Maps'
        }).addTo(map);

        // Fetch data from the Longdo feed
        const feedUrl = "https://event.longdo.com/feed/json?fbclid=IwY2xjawUlhdZleHRuA2FlbQIxMABwZG9mBWJyaWQRMUFXejRRdzBOVU1NUGFKcE5zcnRjBmFwcF9pZBAyMjIwMzkxNzg4MjAwODkyAAEeaVHPSzLbu5S1SZhUdBP6xFWFmXKGLd8smxATGroGDD5kz-TYx0_MOA8a0Fo_aem_Y1PoC3iRRSRT9GarmZKcnA";
        
        fetch(feedUrl)
            .then(response => response.json())
            .then(data => {
                let bounds = [];
                
                data.forEach(event => {
                    if (event.latitude && event.longitude) {
                        let lat = parseFloat(event.latitude);
                        let lng = parseFloat(event.longitude);
                        
                        let marker = L.marker([lat, lng]).addTo(map);
                        
                        // Format icon and styling based on event type
                        let iconHtml = '';
                        let typeClass = '';
                        if (event.icon === 'flood') {
                            iconHtml = '🌊 น้ำท่วม';
                            typeClass = 'type-flood';
                        } else if (event.icon === 'carbreakdown') {
                            iconHtml = '🚗 รถเสีย';
                            typeClass = 'type-breakdown';
                        } else if (event.icon === 'accident') {
                            iconHtml = '💥 อุบัติเหตุ';
                            typeClass = 'type-accident';
                        } else {
                            iconHtml = '📍 ' + event.title;
                        }
                        
                        let popupHtml = `
                            <div class="popup-content">
                                <h3 class="${typeClass}">${iconHtml}</h3>
                                <strong>${event.title}</strong>
                                <p>${event.description || ''}</p>
                                <small>เวลา: ${event.start || '-'} ถึง ${event.stop || '-'}</small>
                            </div>
                        `;
                        
                        marker.bindPopup(popupHtml);
                        bounds.push([lat, lng]);
                    }
                });
                
                // Adjust map to show all markers
                if (bounds.length > 0) {
                    map.fitBounds(bounds);
                }
            })
            .catch(error => {
                console.error("Error fetching data:", error);
                alert("เกิดข้อผิดพลาดในการโหลดข้อมูลจาก Longdo");
            });
    </script>
</body>
</html>
